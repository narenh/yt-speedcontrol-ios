# Generate CanopyControl.xcodeproj with: xcodegen generate
name: CanopyControl
options:
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: UC3Y84QJ83
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CanopyControl:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.canopysf.CanopyControl
        TARGETED_DEVICE_FAMILY: "1"
      # Passkeys for canopysf.com. Debug skips Apple's AASA CDN (needs Developer Mode on the phone).
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: App/CanopyControl.Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: App/CanopyControl.Release.entitlements
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Canopy Control
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        NSCameraUsageDescription: Canopy Control uses the camera to read the TV's Link with TV code.
    dependencies:
      - target: CanopyControlWidget
  CanopyControlWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.canopysf.CanopyControl.Widget
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Canopy Control
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
